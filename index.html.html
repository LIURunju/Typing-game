<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>漢字インベーダー - Kanji Invaders</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+JP:wght@400;700&display=swap');
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #0c0a09;
      color: #e7e5e4;
      touch-action: manipulation;
    }
    .pixel-font {
      font-family: 'DotGothic16', monospace;
    }
    canvas {
      image-rendering: pixelated;
    }
    .glow-box {
      box-shadow: 0 0 15px rgba(20, 184, 166, 0.25);
    }
    .glow-text {
      text-shadow: 0 0 8px rgba(45, 212, 191, 0.6);
    }
    .glow-red {
      text-shadow: 0 0 8px rgba(244, 63, 94, 0.6);
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-40px) scale(1.2); opacity: 0; }
    }
    .floating-anim {
      animation: floatUp 1.5s ease-out forwards;
    }
    @keyframes pulseHeart {
      0% { transform: scale(1); }
      50% { transform: scale(1.4); }
      100% { transform: scale(1); }
    }
    .pulse-anim {
      animation: pulseHeart 0.5s ease-in-out;
    }

    /* ===== 3D 键盘（无缝贴合版）===== */
    #kanaKeypad.kb {
      display: flex; flex-direction: column;
      margin: 0 -12px -12px;                 /* 抵消外框内边距，键盘铺满整个宽度 */
      width: auto; align-self: stretch;
      padding: 6px 4px 4px;
      background: linear-gradient(180deg, #141210 0%, #0c0a09 100%);
      border-top: 1px solid #292524;
      border-radius: 0 0 14px 14px;
      box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.6);
      overflow: visible;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
    }
    .kb-row { display: flex; }
    /* 按钮本身铺满格子（触摸区域无缝隙），圆角键帽画在 ::before 上 */
    .kb-key {
      position: relative;
      flex: 1 1 0; min-width: 0;
      height: 58px; padding: 0 0 5px;
      border: 0; background: transparent;
      color: #ccfbf1;
      font-family: 'Noto Sans JP', sans-serif; font-weight: 700; font-size: 20px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    .kb-key::before {
      content: "";
      position: absolute; inset: 3px 2px 8px;
      border-radius: 999px;                     /* 药丸形 */
      /* 中间稍微拱起：中央偏上最亮，向边缘逐渐变暗 */
      background: radial-gradient(ellipse 80% 70% at 50% 34%,
        #58524d 0%, #48433f 45%, #3a3632 78%, #312d2a 100%);
      box-shadow:
        0 5px 0 #171412,                          /* 键帽侧面（厚度） */
        0 7px 8px rgba(0, 0, 0, 0.55),            /* 阴影 */
        inset 0 1px 0 rgba(255, 255, 255, 0.18),  /* 顶部高光 */
        inset 0 3px 5px rgba(255, 255, 255, 0.05),
        inset 0 -4px 6px rgba(0, 0, 0, 0.32);     /* 下半部弧面的暗部 */
      transition: transform 45ms ease-out, box-shadow 45ms ease-out, background 70ms ease-out;
    }
    .kb-key > .kb-label {
      position: relative; z-index: 1;
      display: inline-block;
      transition: transform 45ms ease-out;
    }
    .kb-key.is-down { color: #ffffff; }
    .kb-key.is-down::before {
      transform: translateY(4px);
      background: radial-gradient(ellipse 80% 70% at 50% 34%,
        #2dd4bf 0%, #14b8a6 45%, #0f766e 85%, #0d5f59 100%);
      box-shadow:
        0 1px 0 #171412,
        0 2px 3px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        inset 0 -3px 5px rgba(0, 0, 0, 0.25);
    }
    .kb-key.is-down > .kb-label { transform: translateY(4px); }
    .kb-key.kb-wide { flex-grow: 1.3; font-size: 14px; letter-spacing: 0.08em; }
    .kb-key.kb-amber { color: #fbbf24; }
    .kb-key.kb-long { font-size: 22px; }
    .kb-key.kb-amber.is-down { color: #fff; }
    .kb-key.kb-amber.is-down::before { background: radial-gradient(ellipse 80% 70% at 50% 34%, #fbbf24 0%, #f59e0b 45%, #b45309 90%); }
    .kb-key.kb-rose { color: #fb7185; font-size: 21px; }
    .kb-key.kb-rose.is-down { color: #fff; }
    .kb-key.kb-rose.is-down::before { background: radial-gradient(ellipse 80% 70% at 50% 34%, #fb7185 0%, #f43f5e 45%, #be123c 90%); }

    /* 按下时弹出的放大字母（和手机输入法一样） */
    .kb-pop {
      position: absolute; left: 50%; bottom: calc(100% + 8px);
      min-width: 118%; padding: 4px 0 6px;
      border-radius: 999px;
      background: linear-gradient(180deg, #2dd4bf 0%, #0d9488 100%);
      color: #042f2e; font-size: 28px; line-height: 1.2; text-align: center;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.55);
      transform: translateX(-50%) translateY(6px) scale(0.6);
      opacity: 0; pointer-events: none; z-index: 40;
      transition: transform 70ms ease-out, opacity 70ms ease-out;
    }
    .kb-key.is-down .kb-pop { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }

    @media (min-width: 640px) {
      .kb-key { height: 62px; font-size: 22px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .kb-key::before, .kb-key > .kb-label, .kb-pop { transition: none; }
    }

    /* 单词 / 语法释义卡片 */
    #infoCard { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; padding: 16px; }
    #infoCard.open { display: flex; }
    #infoBackdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); }
    #infoPanel {
      position: relative; width: 100%; max-width: 24rem; max-height: 85vh; overflow-y: auto;
      display: flex; flex-direction: column; gap: 12px;
      padding: 20px; border: 2px solid #2dd4bf; border-radius: 16px;
      background: #1c1917; color: #f5f5f4; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    /* 屏幕太矮时，HUD 固定在顶部，分数始终看得见 */
    #hud { position: sticky; top: 0; z-index: 30; }
    .hud-chip { font-size: 11px; line-height: 1; padding: 5px 9px; border-radius: 999px; border-width: 1px; border-style: solid; white-space: nowrap; }
    /* 开始界面分段按钮 */
    .seg-btn { padding: 8px 4px; font-size: 13px; font-weight: 800; border-radius: 12px; background: #292524; color: #d6d3d1; border: 1px solid #44403c; transition: background .15s; }
    .seg-btn.on { background: #0d9488; color: #fff; border-color: #2dd4bf; box-shadow: 0 4px 12px rgba(20,184,166,.3); }
    [hidden] { display: none !important; }
    .hidden { display: none; }   /* Tailwind 没加载出来时，隐藏的画面也不会挡住游戏 */
    /* 开始 / 过关 / 结束画面铺满整个屏幕（小屏手机上不再挤在游戏区里） */
    #startScreen, #stageScreen, #gameOverScreen {
      position: fixed; inset: 0; z-index: 50;
      padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    /* 矮屏幕（iPhone SE / mini / 8 等）：键盘、输入栏、HUD 更紧凑，给游戏区留空间 */
    @media (max-height: 700px) {
      .kb-key { height: 48px; font-size: 19px; }
      #kanaKeypad.kb { padding: 4px 3px 2px; }
      footer .p-3 { padding: 8px; }
      footer .gap-2\.5 { gap: 6px; }
      #kanjiInput { padding-top: 7px; padding-bottom: 7px; }
      footer button.p-2\.5 { padding: 7px; }
      #hud { padding-top: 5px; padding-bottom: 5px; gap: 4px; }
      #hud .text-lg { font-size: 15px; }
    }
    /* 窄屏幕（iPhone SE 第一代等 320–360px 宽）：HUD 和输入栏再紧凑一些 */
    @media (max-width: 370px) {
      #hud .text-lg { font-size: 14px; }
      #hud .text-\[10px\] { font-size: 9px; letter-spacing: 0; }
      #hud > div:first-child { gap: 4px; }
      #diffBadgeText { padding: 1px 5px; font-size: 10px; }
      footer [data-i18n="fire"] { display: none; }
      footer button.p-2\.5 { padding: 7px 8px; }
      footer .px-3\.5 { padding-left: 10px; padding-right: 10px; }
      footer .gap-1\.5 { gap: 4px; }
      #kanjiInput { font-size: 15px; padding-left: 8px; padding-right: 8px; }
    }
    @media (max-height: 600px) {
      .kb-key { height: 42px; font-size: 17px; }
      footer > .text-\[11px\] { display: none; }
      body { padding-top: 4px !important; }
    }
    #gameOverScreen { justify-content: safe center; }
    /* 排行榜 */
    #boardCard { position: fixed; inset: 0; z-index: 66; display: none; align-items: center; justify-content: center; padding: 16px; }
    #boardCard.open { display: flex; }
    #boardBackdrop { position: absolute; inset: 0; background: rgba(0,0,0,.72); backdrop-filter: blur(4px); }
    #boardPanel { position: relative; width: 100%; max-width: 26rem; max-height: 86vh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
      padding: 20px; border: 2px solid #facc15; border-radius: 16px; background: #1c1917; color: #e7e5e4; font-size: 13px; }
    .board-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    .board-table th { font-size: 10px; color: #a8a29e; font-weight: 700; text-align: left; padding: 4px 6px; border-bottom: 1px solid #44403c; letter-spacing: .05em; }
    .board-table td { padding: 6px; border-bottom: 1px solid #292524; white-space: nowrap; }
    .board-table td.name { white-space: normal; word-break: break-all; color: #f5f5f4; font-weight: 700; }
    .board-table td.num { text-align: right; color: #5eead4; font-weight: 700; }
    .board-table tr.me td { background: rgba(250, 204, 21, 0.14); }
    .board-table .rank { color: #facc15; font-weight: 800; width: 2em; }
    .board-sub { font-size: 11px; font-weight: 800; color: #fbbf24; letter-spacing: .06em; margin-bottom: 4px; }
    .board-empty { color: #a8a29e; font-size: 12px; padding: 8px 0; }
    /* 规则弹窗 */
    #rulesCard { position: fixed; inset: 0; z-index: 65; display: none; align-items: center; justify-content: center; padding: 16px; }
    #rulesCard.open { display: flex; }
    #rulesBackdrop { position: absolute; inset: 0; background: rgba(0,0,0,.72); backdrop-filter: blur(4px); }
    #rulesPanel { position: relative; width: 100%; max-width: 26rem; max-height: 86vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
      padding: 20px; border: 2px solid #2dd4bf; border-radius: 16px; background: #1c1917; color: #e7e5e4; font-size: 13px; line-height: 1.65; }
    #rulesPanel h3 { font-size: 12px; font-weight: 800; color: #fbbf24; letter-spacing: .06em; margin-bottom: 4px; }
    #rulesPanel ul { display: flex; flex-direction: column; gap: 4px; padding-left: 1.1em; list-style: disc; }
    #rulesPanel .t-basic { color: #2dd4bf; } #rulesPanel .t-kun { color: #fbbf24; } #rulesPanel .t-boss { color: #f87171; } #rulesPanel .t-combo { color: #c4b5fd; }

    /* 画面揺れ用アニメーション・クラス */
    @keyframes screenShake {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-4px, 3px); }
      40% { transform: translate(4px, -2px); }
      60% { transform: translate(-3px, -3px); }
      80% { transform: translate(3px, 2px); }
      100% { transform: translate(0, 0); }
    }
    .shake-anim {
      animation: screenShake 0.25s ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-2 sm:p-4 select-none">

  <!-- TOP HEADER / HUD -->
  <header id="hud" class="w-full max-w-lg bg-stone-900/90 border border-teal-500/30 rounded-2xl px-3 py-2 mb-2 glow-box flex flex-col gap-1.5 whitespace-nowrap">
    <div class="flex justify-between items-center gap-2 text-xs font-bold tracking-wider text-teal-400">
      <div class="flex items-baseline gap-1 min-w-0">
        <span class="text-stone-400 text-[10px]">SCORE</span>
        <span id="scoreText" class="pixel-font text-lg text-teal-200 tabular-nums">00000</span>
      </div>
      <div class="flex items-baseline gap-1">
        <span class="text-stone-400 text-[10px]">COMBO</span>
        <span id="comboText" class="pixel-font text-lg text-yellow-400">x1</span>
      </div>
      <div class="flex items-baseline gap-1">
        <span id="waveLabel" class="text-stone-400 text-[10px]">WAVE</span>
        <span id="waveText" class="pixel-font text-lg text-teal-200">01</span>
      </div>
      <span id="diffBadgeText" class="px-2 py-0.5 rounded text-[11px] bg-teal-950 text-teal-300 border border-teal-500/40">初级</span>
    </div>
    <div class="flex justify-between items-center gap-2 text-xs border-t border-stone-800 pt-1.5">
      <div class="flex items-center gap-1.5 min-w-0">
        <span class="text-stone-400 text-[10px]">SHIELD</span>
        <div id="livesContainer" class="flex items-center gap-1.5 text-rose-500 text-sm">
          <i class="fa-solid fa-shield-heart"></i>
          <i class="fa-solid fa-shield-heart"></i>
          <i class="fa-solid fa-shield-heart"></i>
        </div>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button type="button" onclick="cycleLang()" id="hudLangBtn" class="hud-chip text-teal-200 bg-stone-900 border-stone-700 font-bold" aria-label="Language">中</button>
        <button type="button" onclick="openRules()" class="hud-chip text-amber-300 bg-stone-900 border-stone-700" data-i18n-aria="rules" data-i18n-title="rules"><i class="fa-solid fa-circle-question"></i></button>
      </div>
    </div>
  </header>

  <!-- GAME CANVAS CONTAINER -->
  <main id="gameContainer" class="w-full max-w-lg relative bg-stone-950 border-2 border-teal-500/40 rounded-t-2xl border-b-0 overflow-hidden shadow-2xl flex flex-col items-center">
    <canvas id="gameCanvas" class="w-full block bg-stone-950 cursor-crosshair"></canvas>

    <!-- OVERLAYS / MODALS -->
    <div id="startScreen" class="absolute inset-0 bg-stone-950/95 backdrop-blur-md z-20 overflow-y-auto">
      <div class="min-h-full flex flex-col items-center justify-center p-5 text-center gap-3">
      <div class="grid grid-cols-3 gap-1.5 w-full max-w-xs" role="group" aria-label="Language">
        <button type="button" id="lang-zh" onclick="setLang('zh')" class="seg-btn">中文</button>
        <button type="button" id="lang-en" onclick="setLang('en')" class="seg-btn">English</button>
        <button type="button" id="lang-ja" onclick="setLang('ja')" class="seg-btn">日本語</button>
      </div>
      <div>
        <div class="text-teal-400 text-3xl font-black pixel-font glow-text">漢字インベーダー</div>
        <p class="text-[11px] text-stone-400 mt-1" data-i18n="subtitle">KANJI INVADERS - JLPT 単語・文法ディフェンス</p>
      </div>

      <div class="w-full max-w-xs flex flex-col gap-2.5 text-left">
        <div>
          <div class="text-[11px] text-teal-300 font-bold mb-1" data-i18n="level">级别</div>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" id="lvN2" onclick="selectLevel('N2')" class="seg-btn">N2</button>
            <button type="button" id="lvN1" onclick="selectLevel('N1')" class="seg-btn">N1</button>
          </div>
        </div>
        <div>
          <div class="text-[11px] text-teal-300 font-bold mb-1" data-i18n="mode">模式</div>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" id="modeCampaign" onclick="selectMode('campaign')" class="seg-btn" data-i18n="campaign">通关模式</button>
            <button type="button" id="modeEndless" onclick="selectMode('endless')" class="seg-btn" data-i18n="endless">无尽模式</button>
          </div>
        </div>
        <div>
          <label for="stageSelect" id="stageLabel" class="block text-[11px] text-teal-300 font-bold mb-1">从哪一天开始</label>
          <select id="stageSelect" class="w-full bg-stone-900 text-teal-100 text-xs font-bold p-2.5 rounded-xl border border-stone-700 focus:outline-none focus:border-teal-400"></select>
        </div>
        <div>
          <div class="text-[11px] text-teal-300 font-bold mb-1" data-i18n="difficulty">难度</div>
          <div class="grid grid-cols-3 gap-2">
            <button onclick="setDifficulty('easy')" id="btnEasy" class="py-2 px-1 text-xs rounded-xl bg-teal-600 text-white font-bold transition hover:bg-teal-500 border border-teal-400 shadow-lg">初級</button>
            <button onclick="setDifficulty('normal')" id="btnNormal" class="py-2 px-1 text-xs rounded-xl bg-stone-800 text-stone-300 font-bold transition hover:bg-stone-700 border border-stone-700">中級</button>
            <button onclick="setDifficulty('hard')" id="btnHard" class="py-2 px-1 text-xs rounded-xl bg-stone-800 text-stone-300 font-bold transition hover:bg-stone-700 border border-stone-700">上級</button>
          </div>
          <p id="diffDesc" class="text-[11px] text-stone-400 mt-1.5">初級: 显示假名提示，敌人速度较慢。</p>
        </div>
      </div>

      <div class="w-full max-w-xs flex gap-2">
        <button onclick="startGame()" class="flex-1 py-3 px-4 bg-gradient-to-r from-teal-500 to-emerald-600 text-stone-950 font-black rounded-xl text-base shadow-lg shadow-teal-500/30 hover:brightness-110 active:scale-95 transition">
          <i class="fa-solid fa-play mr-1.5"></i> START
        </button>
        <button type="button" onclick="openRules()" class="px-4 rounded-xl bg-stone-800 text-amber-300 font-bold text-sm border border-stone-700 active:scale-95 transition" data-i18n-aria="rules">
          <i class="fa-solid fa-circle-question mr-1"></i><span data-i18n="rules">规则</span>
        </button>
        <button type="button" onclick="openBoard()" class="px-4 rounded-xl bg-stone-800 text-yellow-300 font-bold text-sm border border-stone-700 active:scale-95 transition" data-i18n-aria="board" data-i18n-title="board">
          <i class="fa-solid fa-trophy"></i>
        </button>
      </div>
      <p id="bestLine" class="text-[11px] text-stone-400 tabular-nums"></p>
      </div>
    </div>

    <!-- 过关 / 通关 -->
    <div id="stageScreen" class="absolute inset-0 bg-stone-950/95 backdrop-blur-md z-20 hidden overflow-y-auto">
      <div class="min-h-full flex flex-col items-center justify-center p-6 text-center gap-3">
        <div id="stageTitle" class="text-amber-300 text-3xl font-black pixel-font"></div>
        <p id="stageSub" class="text-xs text-stone-300 max-w-xs"></p>
        <div id="stageStats" class="bg-stone-900 border border-stone-800 p-3 rounded-2xl w-full max-w-xs text-sm text-stone-300"></div>
        <form id="nameForm" class="w-full max-w-xs flex flex-col gap-2 text-left" hidden>
          <label for="playerName" class="text-[11px] font-bold text-yellow-300" data-i18n="nameLabel">输入名字，登上排行榜</label>
          <div class="flex gap-2">
            <input id="playerName" type="text" maxlength="12" autocomplete="nickname" class="flex-1 min-w-0 bg-stone-950 text-teal-100 px-3 py-2.5 rounded-xl border border-teal-500/40 text-base font-bold focus:outline-none focus:border-teal-300">
            <button type="submit" class="px-4 rounded-xl bg-yellow-400 text-stone-950 font-black text-sm active:scale-95 transition" data-i18n="saveName">保存</button>
          </div>
        </form>
        <div id="boardView" class="w-full max-w-xs" hidden></div>
        <button id="stagePrimary" type="button" class="w-full max-w-xs py-3 px-6 bg-gradient-to-r from-teal-500 to-emerald-600 text-stone-950 font-black rounded-xl text-base active:scale-95 transition"></button>
        <button id="stageSecondary" type="button" class="w-full max-w-xs py-2.5 px-6 bg-stone-800 text-stone-200 font-bold rounded-xl text-sm border border-stone-700 active:scale-95 transition"></button>
      </div>
    </div>

    <div id="gameOverScreen" class="absolute inset-0 bg-stone-950/95 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20 hidden overflow-y-auto">
      <div class="text-rose-500 text-3xl font-black pixel-font mb-1 glow-red" data-i18n="goTitle">防衛防線突破</div>
      <p class="text-xs text-stone-400 mb-6" data-i18n="goSub">GAME OVER</p>
      
      <div class="bg-stone-900 border border-stone-800 p-4 rounded-2xl w-full max-w-xs mb-6 space-y-2 text-sm">
        <div class="flex justify-between text-stone-400"><span data-i18n="goScore">Score</span> <span id="finalScore" class="pixel-font text-teal-400 font-bold">0</span></div>
        <div class="flex justify-between text-stone-400"><span data-i18n="goWave">Wave</span> <span id="finalWave" class="pixel-font text-teal-400 font-bold">1</span></div>
        <div class="flex justify-between text-stone-400"><span data-i18n="goDefeated">Defeated</span> <span id="finalDefeated" class="pixel-font text-teal-400 font-bold">0</span></div>
      </div>

      <form id="goNameForm" class="w-full max-w-xs flex flex-col gap-2 text-left mb-3" hidden>
        <label for="goPlayerName" class="text-[11px] font-bold text-yellow-300" data-i18n="nameLabel">输入名字，登上排行榜</label>
        <div class="flex gap-2">

た。","exZh":"买东西时顺便去了邮局。","d":4},{"p":"～きり","s":"～きり","a":["きり"],"zh":"……之后就再也没……","en":"since; only (and nothing after)","c":"动た形＋きり","ex":"学生時代に習ったきりで、忘れてしまった。","exZh":"学生时代学过之后就没再碰，忘了。","d":4},{"p":"～一方だ","s":"～一方だ","a":["いっぽうだ"],"zh":"越来越……（单向变化）","en":"keeps on (getting more)","c":"动辞书形＋一方だ","ex":"物価は上がる一方だ。","exZh":"物价一个劲儿地上涨。","d":4},{"p":"～に限って","s":"～に限って","a":["にかぎって"],"zh":"偏偏……；唯独……","en":"only; of all times","c":"名＋に限って","ex":"急いでいる時に限って、タクシーが来ない。","exZh":"偏偏急的时候打不到车。","d":4},{"p":"～気味","s":"～気味","a":["ぎみ"],"zh":"有点……的倾向","en":"a touch of; slightly","c":"动ます形/名＋気味","ex":"最近、風邪気味だ。","exZh":"最近有点感冒。","d":4},{"p":"～ぶりに","s":"～ぶりに","a":["ぶりに"],"zh":"时隔……","en":"for the first time in","c":"时间＋ぶりに","ex":"5年ぶりに帰国した。","exZh":"时隔五年回国了。","d":4},{"p":"～とたん（に）","s":"～とたん（に）","a":["とたんに","とたん"],"zh":"刚一……就……","en":"the moment ...","c":"动た形＋とたん（に）","ex":"母の顔を見たとたんに、泣き出した。","exZh":"一看到母亲的脸就哭了起来。","d":4},{"p":"～ことだから","s":"～ことだから","a":["ことだから"],"zh":"因为是……（所以可推断）","en":"knowing (him), surely","c":"名の＋ことだから","ex":"時間にルーズな彼のことだから、今日も遅れるだろう。","exZh":"他一向不守时，今天大概也会迟到。","d":4},{"p":"～かねない","s":"～かねない","a":["かねない"],"zh":"有可能……（负面）","en":"might well (something bad)","c":"动ます形＋かねない","ex":"説明しないと、誤解を招きかねない。","exZh":"不解释的话，可能招致误解。","d":5},{"p":"～っこない","s":"～っこない","a":["っこない"],"zh":"不可能……（口语）","en":"no way that","c":"动ます形＋っこない","ex":"そんなこと、できっこないよ。","exZh":"那种事不可能做到。","d":5},{"p":"～としたら","s":"～としたら","a":["としたら"],"zh":"如果……的话","en":"if; supposing","c":"普通形＋としたら","ex":"生まれ変わるとしたら、鳥になりたい。","exZh":"如果能转世，想变成鸟。","d":5},{"p":"～といっても","s":"～といっても","a":["といっても"],"zh":"虽说……但也只是……","en":"although (only)","c":"普通形＋といっても","ex":"旅行といっても、一泊だけだ。","exZh":"虽说是旅行，也只住一晚。","d":5},{"p":"～がたい","s":"～がたい","a":["がたい"],"zh":"难以……","en":"hard to","c":"动ます形＋がたい","ex":"仲間を裏切るなんて、許しがたい。","exZh":"背叛同伴，难以原谅。","d":5},{"p":"～からこそ","s":"～からこそ","a":["からこそ"],"zh":"正因为……才……","en":"precisely because","c":"普通形＋からこそ","ex":"子どもを思っているからこそ、厳しくするのだ。","exZh":"正因为为孩子着想才严格。","d":5},{"p":"～ないこともない","s":"～ないこともない","a":["ないこともない"],"zh":"也不是不……","en":"it's not that ... not","c":"动ない形＋ないこともない","ex":"急げば、間に合わないこともない。","exZh":"赶一赶的话，也不是来不及。","d":5},{"p":"～をきっかけに","s":"～をきっかけに","a":["をきっかけに"],"zh":"以……为契机","en":"taking ... as an opportunity","c":"名＋をきっかけに","ex":"留学をきっかけに、料理を始めた。","exZh":"以留学为契机开始做饭。","d":5},{"p":"～かのように","s":"～かのように","a":["かのように"],"zh":"就好像……似的","en":"as if","c":"普通形＋かのように","ex":"何も知らないかのような顔をしている。","exZh":"一副好像什么都不知道的样子。","d":5},{"p":"～につき","s":"～につき","a":["につき"],"zh":"因为……（告示用语）","en":"due to (notices)","c":"名＋につき","ex":"清掃中につき、ご利用になれません。","exZh":"正在清扫，暂停使用。","d":5},{"p":"～ない限り","s":"～ない限り","a":["ないかぎり"],"zh":"只要不……就（不）……","en":"unless","c":"动ない形＋ない限り","ex":"考え方を変えない限り、変化は期待できない。","exZh":"只要不改变想法，就别指望有变化。","d":6},{"p":"～ずに済む","s":"～ずに済む","a":["ずにすむ"],"zh":"不用……也可以","en":"can get by without","c":"动ない形＋ずに済む","ex":"電話で連絡がつけば、行かずに済む。","exZh":"电话能联系上的话，就不用跑一趟了。","d":6},{"p":"～ようではないか","s":"～ようではないか","a":["ようではないか"],"zh":"让我们……吧（号召）","en":"let us ...","c":"动意志形＋ではないか","ex":"力を合わせて成功させようではないか。","exZh":"让我们齐心协力取得成功吧。","d":6},{"p":"～にほかならない","s":"～にほかならない","a":["にほかならない"],"zh":"正是……，无非是……","en":"nothing but; precisely","c":"名＋にほかならない","ex":"成功は努力の結果にほかならない。","exZh":"成功无非是努力的结果。","d":6},{"p":"～でさえ","s":"～でさえ","a":["でさえ"],"zh":"连……都……","en":"even","c":"名＋でさえ","ex":"機械が苦手な私でさえ使えた。","exZh":"连不擅长机械的我都会用。","d":6},{"p":"～に決まっている","s":"～に決まっている","a":["にきまっている"],"zh":"肯定……，一定……","en":"must be; certainly","c":"普通形＋に決まっている","ex":"一人で終わらせるのは無理に決まっている。","exZh":"一个人做完肯定不可能。","d":6},{"p":"～くらいなら","s":"～くらいなら","a":["くらいなら"],"zh":"与其……不如……","en":"rather than","c":"动辞书形＋くらいなら","ex":"あんな人に頼むくらいなら、自分でやる。","exZh":"与其求那种人，不如自己做。","d":6},{"p":"～はもちろん","s":"～はもちろん","a":["はもちろん"],"zh":"……自不必说","en":"not to mention","c":"名＋はもちろん","ex":"外国人はもちろん、日本人にも難しい。","exZh":"外国人自不必说，日本人也觉得难。","d":6},{"p":"～ことはなかった","s":"～ことはなかった","a":["ことはなかった"],"zh":"本来没必要……","en":"didn't need to","c":"动辞书形＋ことはなかった","ex":"無理して買うことはなかったのに。","exZh":"本来没必要勉强买的。","d":6},{"p":"～にしても","s":"～にしても","a":["にしても"],"zh":"即使……也……；就……而言","en":"even if; 〜にしても","a":["にしても"],"zh":"即使站在……立场；即便……","en":"even if; even for","c":"","ex":"冗談にしても、言いすぎだ。","exZh":"即便是玩笑，也说得太过分了。","d":1},{"p":"〜いかんでは","s":"〜いかんでは","a":["いかんでは"],"zh":"根据……（结果可能）","en":"depending on","c":"","ex":"結果いかんでは、計画を変えるかもしれない。","exZh":"根据结果，也许会改变计划。","d":1},{"p":"〜にあっては","s":"〜にあっては","a":["にあっては"],"zh":"处于……、在……之下","en":"in (a special situation)","c":"","ex":"今の時代にあっては、スマホは必需品だ。","exZh":"在当今时代，手机是必需品。","d":1},{"p":"〜にあっても","s":"〜にあっても","a":["にあっても"],"zh":"即使在……状况下仍……","en":"even in","c":"","ex":"苦しい状況にあっても、彼は笑顔を忘れない。","exZh":"即使处在困境中，他也不忘微笑。","d":1},{"p":"〜に至っては","s":"〜に至っては","a":["にいたっては"],"zh":"说到……竟到了这种程度","en":"as for ... (even)","c":"","ex":"兄は遅刻が多いが、弟に至っては毎日遅れて来る。","exZh":"哥哥常迟到，弟弟更是每天都迟到。","d":1},{"p":"〜ずくめ","s":"〜ずくめ","a":["ずくめ"],"zh":"全是……（多为好事）","en":"nothing but","c":"","ex":"今年はいいことずくめの一年だった。","exZh":"今年是净是好事的一年。","d":2},{"p":"〜つつある","s":"〜つつある","a":["つつある"],"zh":"正在逐渐……","en":"is in the process of","c":"","ex":"町の人口は減りつつある。","exZh":"小镇的人口正在逐渐减少。","d":2},{"p":"〜ながら","s":"〜ながら","a":["ながら"],"zh":"保持原有状态（いつもながら）","en":"as always; while still","c":"","ex":"いつもながら、彼の料理はおいしい。","exZh":"他做的菜一如既往地好吃。","d":2},{"p":"〜にもかかわらず","s":"〜にもかかわらず","a":["にもかかわらず"],"zh":"尽管……却……","en":"despite","c":"","ex":"雨にもかかわらず、たくさんの人が来た。","exZh":"尽管下雨，还是来了很多人。","d":2},{"p":"〜にも増して","s":"〜にも増して","a":["にもまして"],"zh":"比……更加……","en":"even more than","c":"","ex":"今年の夏は去年にも増して暑い。","exZh":"今年夏天比去年更热。","d":2},{"p":"〜に先立って","s":"〜に先立って","a":["にさきだって"],"zh":"在……之前","en":"prior to","c":"","ex":"開会に先立って、社長があいさつした。","exZh":"开会之前，社长致了辞。","d":2},{"p":"〜ものの","s":"〜ものの","a":["ものの"],"zh":"虽然……但是……","en":"although","c":"","ex":"買ったものの、一度も使っていない。","exZh":"虽然买了，却一次也没用过。","d":2},{"p":"〜ものを","s":"〜ものを","a":["ものを"],"zh":"明明……就好了（遗憾、责备）","en":"if only ... (regret)","c":"","ex":"言ってくれれば手伝ったものを。","exZh":"你要是说一声我就帮你了。","d":2},{"p":"やれ〜やれ〜","s":"やれ仕事だやれ会議だ","a":["やれしごとだやれかいぎだ"],"zh":"什么……啦，什么……啦","en":"what with ... and ...","c":"","ex":"やれ宿題だ、やれ塾だと、子供は忙しい。","exZh":"又是作业又是补习班，孩子很忙。","d":2},{"p":"〜を境に","s":"〜を境に","a":["をさかいに"],"zh":"以……为界","en":"from ... on (turning point)","c":"","ex":"その日を境に、彼は変わった。","exZh":"以那天为界，他变了。","d":3},{"p":"〜を限りに","s":"〜を限りに","a":["をかぎりに"],"zh":"以……为截止、到……为止","en":"as of (ending)","c":"","ex":"今日を限りに、お酒をやめる。","exZh":"从今天起戒酒。","d":3},{"p":"〜にあたらない","s":"〜にあたらない","a":["にあたらない"],"zh":"无需……；不值得……","en":"no need to","c":"","ex":"そんなことで驚くにはあたらない。","exZh":"那种事不值得惊讶。","d":3},{"p":"〜にたえない","s":"〜にたえない","a":["にたえない"],"zh":"不堪……；不胜……","en":"unbearable to; deeply","c":"","ex":"被害の様子は見るにたえない。","exZh":"受灾的情况惨不忍睹。","d":3},{"p":"〜にほかならない","s":"〜にほかならない","a":["にほかならない"],"zh":"正是……；不外乎……","en":"nothing other than","c":"","ex":"今回の成功は皆の努力にほかならない。","exZh":"这次的成功正是大家努力的结果。","d":3},{"p":"〜に足りない","s":"〜に足りない","a":["にたりない"],"zh":"不足以……；不值得……","en":"not worth","c":"","ex":"そんな小さな失敗は、気にするに足りない。","exZh":"那么小的失误不值得在意。","d":3},{"p":"お／ご〜できる","s":"ご案内できる","a":["ごあんないできる"],"zh":"「お／ご〜する」的可能形","en":"(humble) can do","c":"","ex":"明日までにご用意できます。","exZh":"明天之前可以为您准备好。","d":3},{"p":"〜とばかりに","s":"〜とばかりに","a":["とばかりに"],"zh":"几乎就要说……似的","en":"as if to say","c":"","ex":"彼は「待ってました」とばかりに立ち上がった。","exZh":"他像是在说“就等这个了”似的站了起来。","d":3},{"p":"〜とまでは言わないが","s":"〜とまでは言わないが","a":["とまではいわないが"],"zh":"虽不至于说……但至少……","en":"I won't go so far as to say","c":"","ex":"天才とまでは言わないが、彼は頭がいい。","exZh":"虽不至于说是天才，但他很聪明。","d":3},{"p":"いくら〜ところで","s":"いくら謝ったところで","a":["いくらあやまったところで"],"zh":"无论怎么……都（没用）","en":"no matter how much","c":"","ex":"いくら謝ったところで、許してもらえない。","exZh":"无论怎么道歉也不会被原谅。","d":4},{"p":"〜にさえ","s":"〜にさえ","a":["にさえ"],"zh":"连……都……","en":"even to","c":"","ex":"そんなこと、親にさえ話していない。","exZh":"那件事连父母都没告诉。","d":4},{"p":"〜として〜ない","s":"一人として来ない","a":["ひとりとしてこない"],"zh":"没有一个……","en":"not a single","c":"","ex":"一人として遅刻した人はいなかった。","exZh":"没有一个人迟到。","d":4},{"p":"〜かといえば","s":"〜かといえば","a":["かといえば"],"zh":"至于是否……","en":"as for whether","c":"","ex":"好きかといえば、そうでもない。","exZh":"要说喜不喜欢，也没那么喜欢。","d":4},{"p":"〜ぐらいなら〜ほうがましだ","s":"待つぐらいなら歩くほうがましだ","a":["まつぐらいならあるくほうがましだ"],"zh":"与其……不如……","en":"rather than ..., better to","c":"",     function makeBag(getList) {
      let bag = [];
      return function next(avoid) {
        if (bag.length === 0) {
          bag = getList().slice();
          for (let i = bag.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));

        for (let k = bag.length - 1; k >= 0; k--) {

      function safePlayKick(t, volume = 0.25) {
        try {
          const startTime = Math.max(t, ctx.currentTime);
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(150, startTime);
          o.frequency.exponentialRampToValueAtTime(50, startTime + 0.08);

          const safeVol = Math.max(0.0001, volume);
          g.gain.setValueAtTime(safeVol, startTime);
          g.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.3);

          o.connect(g); g.connect(masterGain);
          o.start(startTime); o.stop(startTime + 0.35);
        } catch (e) {}
      }

      function safePlaySnare(t, volume = 0.12) {
        try {
          const startTime = Math.max(t, ctx.currentTime);
          const safeVol = Math.max(0.0001, volume);

          if (sharedNoiseBuffer) {
            const src = ctx.createBufferSource();
            src.buffer = sharedNoiseBuffer;
            const hp = ctx.createBiquadFilter();
            hp.type = 'highpass'; hp.frequency.value = 1000;
            const g1 = ctx.createGain();
            g1.gain.setValueAtTime(safeVol, startTime);
            g1.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.12);
            src.connect(hp); hp.connect(g1); g1.connect(masterGain);
            src.start(startTime); src.stop(startTime + 0.14);
          }

          const o2 = ctx.createOscillator();
          const g2 = ctx.createGain();
          o2.type = 'triangle';
          o2.frequency.setValueAtTime(180, startTime);
          g2.gain.setValueAtTime(safeVol * 0.8, startTime);
          g2.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.06);
          o2.connect(g2); g2.connect(masterGain);

      }

      function playExpressiveSuonaNote(m, t, dur, beatInMeasure, phraseIndex) {
        if (m === null) return;
        const o = ctx.createOscillator();
        const bp = ctx.createBiquadFilter();
        const lp = ctx.createBiquadFilter();
        const g = ctx.createGain();

        o.type = 'sawtooth';
        const baseFreq = freq(m);

        const portamentoTime = 0.04;
        o.frequency.setValueAtTime(baseFreq * Math.pow(2, -35 / 1200), t);
        o.frequency.linearRampToValueAtTime(baseFreq, t + portamentoTime);

        if (dur >= 2.0) {
          const lfo = ctx.createOscillator();
          const lfoGain = ctx.createGain();
          lfo.frequency.value = 5.5;
          lfoGain.gain.setValueAtTime(baseFreq * (5 / 1200), t + 0.3);
          lfoGain.gain.linearRampToValueAtTime(baseFreq * (25 / 1200), t + dur);
          lfo.connect(o.frequency);
          lfo.start(t + 0.3);
          lfo.stop(t + dur);
        }

        const baseCutoff = 1800 + (m - 68) * 40;
        bp.type = 'bandpass'; bp.frequency.value = 1400; bp.Q.value = 1.2;
        lp.type = 'lowpass';
        if (dur >= 2.0) {
          lp.frequency.setValueAtTime(baseCutoff, t);
          lp.frequency.linearRampToValueAtTime(Math.min(3800, baseCutoff + 1500), t + dur);
        } else {
          lp.frequency.value = Math.min(3600, baseCutoff + 400);
        }

        let beatMult = 0.9;
        const bMod = beatInMeasure % 4;
        if (bMod === 0) beatMult = 1.25;
        else if (bMod === 2) beatMult = 1.1;

        let phraseMult = 1.0;
        const pMod = phraseIndex % 4;
        if (pMod === 0 || pMod === 1) phraseMult = 0.9;
        else if (pMod === 2) phraseMult = 1.0;
        else if (pMod === 3) phraseMult = 1.1;

        const randomJitter = 0.92 + Math.random() * 0.16;
        let peakVol = 0.09 * beatMult * phraseMult * randomJitter;

        const actualDur = (dur < 0.6) ? dur * 0.8 : dur;

        g.gain.setValueAtTime(0, t);
        if (dur >= 2.0) {
          g.gain.linearRampToValueAtTime(peakVol * 0.7, t + 0.03);
          g.gain.linearRampToValueAtTime(peakVol * 1.1, t + dur * 0.6);
          g.gain.linearRampToValueAtTime(0.001, t + actualDur);
        } else {
          g.gain.linearRampToValueAtTime(peakVol, t + 0.02);
          g.gain.setValueAtTime(peakVol, t + Math.max(0.02, actualDur - 0.08));
          g.gain.linearRampToValueAtTime(0.001, t + actualDur);
        }

        o.connect(bp); bp.connect(lp); lp.connect(g);
        g.connect(lpFilter);

        o.start(t); o.stop(t + actualDur + 0.05);
      }

      function playHarmonyNote(m, t, dur, vol = 0.04) {
        if (m === null) return;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'triangle';
        o.frequency.value = freq(m);

        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.05);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);

        o.connect(g); g.connect(lpFilter);
        o.start(t); o.stop(t + dur + 0.05);
      }

      function playBossLead(midi, t, duration) {

            g.gain.linearRampToValueAtTime(peak * 0.8, t + duration * 0.7);
            const lfo = ctx.createOscillator();
            const lfoGain = ctx.createGain();
            lfo.frequency.value = 5.5;
            lfoGain.gain.setValueAtTime(0, t);
            lfoGain.gain.linearRampToValueAtTime(freq(midi) * (14 / 1200), t + 0.6);
            lfo.connect(lfoGain); lfoGain.connect(o1.frequency); lfoGain.connect(o2.frequency);
            lfo.start(t); lfo.stop(t + duration + 0.05);
          } else {
            g.gain.setValueAtTime(peak, t + Math.max(0.01, duration - 0.1));
          }
          g.gain.linearRampToValueAtTime(0.001, t + duration);
          o1.connect(g); o2.connect(g); g.connect(lpFilter);
          o1.start(t); o2.start(t);
          o1.stop(t + duration + 0.05); o2.stop(t + duration + 0.05);
        } catch (e) {}
      }

      // 古筝刮奏：沿 ♭E 五声音阶往上拨，到顶再从头开始
      const zhengScale = [75, 77, 79, 82, 84, 87, 89, 91, 94, 96];
      function playZhengPluck(t, duration) {
        try {
          const m = zhengScale[zhengStep % zhengScale.length];
          zhengStep++;
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = 'triangle';
          o.frequency.value = freq(m);
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(0.07, t + 0.004);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
          o.connect(g); g.connect(lpFilter);
          o.start(t); o.stop(t + 0.4);
        } catch (e) {}
      }

      function schedule() {
        if (!isPlaying) return;
        while (nextNoteTime < ctx.currentTime + 1.0) {
          if (pendingMode) {
            currentMode = pendingMode;
            pendingMode = null;
            noteIndex = 0;
            scoreLoopCount = 0;
            bossBeatPos = 0;
          }

          if (currentMode === 'boss') {
            const bpm = 150;
            const beatDuration = 60 / bpm;
            if (noteIndex >= bossFullScore.length) {
              noteIndex = 0;
              bossBeatPos = 0;
            }
            const midi = bossFullScore[noteIndex][0];
            const beats = bossFullScore[noteIndex][1];
            const duration = beats * beatDuration;
            const t = nextNoteTime;

            if (midi === 'X') {
              playZhengPluck(t, duration);
            } else if (midi !== null) {
              zhengStep = 0;
              playBossLead(midi, t, duration);
            }

            // 鼓点和低音按拍子对齐：每小节第 1、3 拍底鼓，第 1 拍低音
            const startBeat = bossBeatPos;
            const endBeat = bossBeatPos + beats;
            for (let bt = Math.ceil(startBeat - 1e-6); bt < endBeat - 1e-6; bt++) {
              const when = t + (bt - startBeat) * beatDuration;
              const inBar = bt % 4;
              if (inBar === 0 || inBar === 2) safePlayKick(when, 0.35);
              if (inBar === 0) {
                let root = null;
                for (let k = noteIndex; k < bossFullScore.length; k++) {
                  if (typeof bossFullScore[k][0] === 'number') { root = bossFullScore[k][0]; break; }
                }
                if (root !== null) {
                  while (root > 46) root -= 12;
                  playHarmonyNote(root, when, beatDuration * 3.8, 0.05);
                }
              }
            }
            bossBeatPos = endBeat;
            nextNoteTime += duration;
          } else {
            const bpm = 135;
            const beatDuration = 60 / bpm;
            const currentScoreArray = emeiScoreVersionA;
            
            if (noteIndex >= currentScoreArray.length) {
              noteIndex = 0;
              scoreLoopCount++;
            }

            const item = currentScoreArray[noteIndex];
            const duration = item.dur * beatDuration;
            const beatInMeasure = Math.floor(nextNoteTime / beatDuration) % 4;
            const phraseIndex = Math.floor(noteIndex / 4);

            let introVolMult = 1.0;
            if (noteIndex < 16) {
              introVolMult = 0.5 + (noteIndex / 16) * 0.5;
            }

            playExpressiveSuonaNote(item.melody, nextNoteTime, duration, beatInMeasure, phraseIndex);
            playExpressiveSuonaNote(item.harmony, nextNoteTime, duration * 0.9, beatInMeasure, phraseIndex);

            if (scoreLoopCount >= 1) {
              playHarmonyNote(item.bass, nextNoteTime, duration, 0.08 * introVolMult);
            } else {
              playHarmonyNote(item.bass, nextNoteTime, duration, 0.04 * introVolMult);
            }

            if (item.kick || item.snare) {
              const beatMod = Math.floor(nextNoteTime / (60 / 135)) % 4;
              let isKick = (beatMod === 0 || beatMod === 2);
              if (!item.kick && item.snare) isKick = false;
              
              let drumVol = 0.25 * introVolMult;
              if (!item.kick && !item.snare) drumVol *= 0.6;

              if (isKick) {
                safePlayKick(nextNoteTime, drumVol);
              } else {
                safePlaySnare(nextNoteTime, drumVol * 0.5);
              }
            }

            if ((noteIndex + 1) % 16 === 0) {
              for (let f = 1; f <= 4; f++) {
                safePlaySnare(nextNoteTime + (duration / 4) * f, 0.15 + (f / 4) * 0.1);
              }
            }

            nextNoteTime += duration;
          }
          noteIndex++;
        }
      }

      return {
        start() {
          initAudio();
          if (isPlaying) return;
          isPlaying = true;
          currentMode = 'normal';
          noteIndex = 0;
          scoreLoopCount = 0;
          nextNoteTime = ctx.currentTime + 0.1;
          masterGain.gain.setValueAtTime(0, ctx.currentTime);
          masterGain.gain.linearRampToValueAtTime(0.25, ctx.currentTime + 1.0);

          clearInterval(timer);
          timer = setInterval(schedule, 200);
        },
        stop() {
          if (!isPlaying) return;
          masterGain.gain.setValueAtTime(masterGain.gain.value, ctx.currentTime);
          masterGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.0);
          setTimeout(() => {
            isPlaying = false;
            clearInterval(timer);
          }, 1000);
        },
        setMode(m) {
          if (m !== currentMode) {
            pendingMode = m;
          }
        }
      };
    }

    function convertRomajiToHiragana(raw) {
      let res = '';
      let i = 0;
      const s = raw.toLowerCase();
      while (i < s.length) {
        if (i + 1 < s.length && s[i] === s[i + 1] && 'bcdfghjklmpqrstvwxyz'.includes(s[i])) {
          res += 'っ';
          i++;
          continue;
        }
        if (s[i] === 'n') {
          if (i + 1 < s.length) {
            const next = s[i + 1];
            if (!'aiueoyn'.includes(next)) {
              res += 'ん';
              i++;
              continue;
            }
          }
        }
        let matched = false;
        for (let len = 4; len >= 1; len--) {
          if (i + len <= s.length) {
            const sub = s.slice(i, i + len);
            if (romajiMap[sub]) {
              res += romajiMap[sub];
              i += len;
              matched = true;
              break;
            }
          }
        }
        if (!matched) {
          res += s[i];
          i++;
        }
      }
      return res;
    }

      const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      function iosTick() {
        if (!isIOS || 'vibrate' in navigator) return;
        try {
          const label = document.createElement('label');
          label.setAttribute('aria-hidden', 'true');
          label.style.display = 'none';
          const sw = document.createElement('input');
          sw.type = 'checkbox';
          sw.setAttribute('switch', '');

          document.head.appendChild(label);

        const d = key.dataset;

        else if (d.action === 'back') backspaceKana();
      }

      // 按住退格键连续删除
      let repeatDelay = null, repeatTimer = null;
      function stopRepeat() {
        clearTimeout(repeatDelay); clearInterval(repeatTimer);
        repeatDelay = repeatTimer = null;
      }

      function release(key) {
        if (!key || !key.classList.contains('is-down')) return;
        const held = performance.now() - (Number(key.dataset.downAt) || 0);
        setTimeout(() => key.classList.remove('is-down'), Math.max(0, 70 - held)); // 至少让按下效果显示 70ms
      }

      pad.addEventListener('pointerdown', (e) => {
        const key = e.target.closest('.kb-key');
        if (!key) return;
        e.preventDefault();
        key.dataset.downAt = performance.now();
        key.classList.add('is-down');
        try { key.setPointerCapture(e.pointerId); } catch (err) {}
        press(key);
        if (key.dataset.action === 'back') {
          stopRepeat();
          repeatDelay = setTimeout(() => {
            repeatTimer = setInterval(() => press(key), 70);
          }, 420);
        }
      });

      const onUp = (e) => {
        const key = e.target.closest && e.target.closest('.kb-key');
        if (key && key.dataset.action === 'back') stopRepeat();
        if (key) {
          if (e.type === 'pointerup') iosTick(); // iOS 只允许在抬手时触发触感
          release(key);
        }
      };
      pad.addEventListener('pointerup', onUp);
      pad.addEventListener('pointercancel', onUp);
      pad.addEventListener('lostpointercapture', onUp);
      pad.addEventListener('contextmenu', (e) => e.preventDefault()); // 长按不弹菜单
