    const ENEMY_PALETTE = {
      basic: { fill: 'rgba(15, 61, 58, 0.92)', wing: 'rgba(20, 90, 84, 0.85)', edge: '#2dd4bf', glow: '#14b8a6', deco: 'rgba(94, 234, 212, 0.55)', core: 'rgba(4, 30, 28, 0.55)', hint: '#99f6e4' },
      kun:   { fill: 'rgba(92, 52, 6, 0.92)',  wing: 'rgba(0,0,0,0)', edge: '#fbbf24', glow: '#f59e0b', deco: 'rgba(253, 230, 138, 0.6)', core: 'rgba(40, 20, 2, 0.55)', hint: '#fef3c7' },
      boss:  { fill: 'rgba(90, 14, 22, 0.94)', wing: 'rgba(0,0,0,0)', edge: '#f87171', glow: '#ef4444', deco: 'rgba(252, 165, 165, 0.6)', core: 'rgba(30, 4, 8, 0.6)', hint: '#fecaca' }
    };
    function polyPath(cx, cy, r, n, rot) {
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const a = rot + i * 2 * Math.PI / n;
        const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }
    function starPath(cx, cy, rOut, rIn, n, rot) {
      ctx.beginPath();
      for (let i = 0; i < n * 2; i++) {
        const a = rot + i * Math.PI / n - Math.PI / 2;
        const rr = i % 2 === 0 ? rOut : rIn;
        const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }
    function fitText(text, x, y, size, maxW, weight) {
      ctx.font = `${weight} ${size}px 'Noto Sans JP', sans-serif`;
      const w = ctx.measureText(text).width;
      if (w > maxW) {
        size = Math.max(11, Math.floor(size * maxW / w));
        ctx.font = `${weight} ${size}px 'Noto Sans JP', sans-serif`;
      }
      ctx.fillText(text, x, y);
    }

    class Invader {
      constructor(isBoss = false, bossObj = null, isSpecialKun = false) {
        this.isBoss = isBoss;
        this.isSpecialKun = isSpecialKun;

        const avoid = wordsOnScreen();
        if (isBoss && bossObj) {
          this.kind = 'boss';
          this.info = bossObj;
          this.word = bossObj.s;
          this.readings = bossObj.a;
          this.hint = bossObj.a[0];
          this.maxHp = 3;
          this.hp = 3;
          this.radius = Math.max(72, Math.min(100, 44 + this.word.length * 6)) * UI_SCALE;
        } else if (isSpecialKun) {
          const item = nextKunWord(avoid);
          this.kind = 'kun';
          this.info = item;
          this.word = item.w;
          this.readings = item.r;
          this.hint = item.r[0];
          this.hp = 1;
          this.maxHp = 1;
          this.radius = Math.max(58, Math.min(70, 34 + this.word.length * 8)) * UI_SCALE;
        } else {
          const item = nextBasicWord(avoid);
          this.kind = 'basic';
          this.info = item;
          this.word = item.w;
          this.readings = item.r;
          this.hint = item.r[0];
          this.hp = 1;
          this.maxHp = 1;
          this.radius = Math.max(48, Math.min(72, 26 + this.word.length * 10)) * UI_SCALE;
        }
        this.variant = Math.floor(Math.random() * 3);
        this.phase = Math.random() * Math.PI * 2;
        this.age = 0;

        this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
        this.y = -this.radius - 20;

        const baseSpeed = ((0.5 + wave * 0.08) * difficultySettings[difficulty].speedMult) * 0.5 * stageSpeedMult();
        this.speed = isBoss ? baseSpeed * 0.65 : baseSpeed;
        this.vx = (Math.random() - 0.5) * 0.2;
        this.defeated = false;
      }

      update() {
        this.age++;
        const slowFactor = slowTimer > 0 ? 0.4 : 1.0;
        this.y += this.speed * slowFactor;
        this.x += this.vx * slowFactor;
        if (this.x < this.radius) { this.x = this.radius; this.vx *= -1; }
        if (this.x > canvas.width - this.radius) { this.x = canvas.width - this.radius; this.vx *= -1; }
      }

      draw() {
        ctx.save();
        const P = ENEMY_PALETTE[this.kind];
        const r = this.radius, x = this.x, y = this.y;
        const t = this.age / 60 + this.phase;
        ctx.lineJoin = 'round';

        if (this.kind === 'boss') {
          // BOSS：旋转的锯齿光环 + 双角 + 符文环
          const pulse = 0.5 + 0.5 * Math.sin(t * 3);
          ctx.shadowColor = P.glow; ctx.shadowBlur = 14 + pulse * 10;
          ctx.fillStyle = P.fill; ctx.strokeStyle = P.edge; ctx.lineWidth = 3;
          starPath(x, y, r, r * 0.86, 14, t * 0.25);
          ctx.fill(); ctx.stroke();
          ctx.shadowBlur = 0;
          // 双角
          ctx.fillStyle = P.edge;
          for (const side of [-1, 1]) {
            ctx.beginPath();
            ctx.moveTo(x + side * r * 0.42, y - r * 0.72);
            ctx.quadraticCurveTo(x + side * r * 0.95, y - r * 1.05, x + side * r * 0.78, y - r * 1.32);
            ctx.quadraticCurveTo(x + side * r * 0.7, y - r * 0.98, x + side * r * 0.2, y - r * 0.82);
            ctx.closePath(); ctx.fill();
          }
          // 符文环
          ctx.strokeStyle = P.deco; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(x, y, r * 0.74, 0, Math.PI * 2); ctx.stroke();
          for (let i = 0; i < 12; i++) {
            const ang = -t * 0.6 + i * Math.PI / 6;
            ctx.beginPath();
            ctx.moveTo(x + Math.cos(ang) * r * 0.68, y + Math.sin(ang) * r * 0.68);
            ctx.lineTo(x + Math.cos(ang) * r * 0.8, y + Math.sin(ang) * r * 0.8);
            ctx.stroke();
          }
          ctx.fillStyle = P.core;
          ctx.beginPath(); ctx.arc(x, y, r * 0.64, 0, Math.PI * 2); ctx.fill();
        } else if (this.kind === 'kun') {
          // 训读特殊兵：旋转手里剑 + 宝石点 + 虚线轨道
          ctx.shadowColor = P.glow; ctx.shadowBlur = 12;
          ctx.fillStyle = P.fill; ctx.strokeStyle = P.edge; ctx.lineWidth = 3;
          starPath(x, y, r, r * 0.7, 8, t * 0.8);
          ctx.fill(); ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.fillStyle = P.edge;
          for (let i = 0; i < 8; i++) {
            const ang = t * 0.8 + i * Math.PI / 4 - Math.PI / 2;
            ctx.beginPath(); ctx.arc(x + Math.cos(ang) * r * 0.9, y + Math.sin(ang) * r * 0.9, 2.5, 0, Math.PI * 2); ctx.fill();
          }
          ctx.setLineDash([5, 6]); ctx.lineDashOffset = -t * 20;
          ctx.strokeStyle = P.deco; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(x, y, r * 0.66, 0, Math.PI * 2); ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = P.core;
          ctx.beginPath(); ctx.arc(x, y, r * 0.6, 0, Math.PI * 2); ctx.fill();
        } else {
          // 普通兵：三种无人机外形
          ctx.shadowColor = P.glow; ctx.shadowBlur = 8;
          ctx.fillStyle = P.fill; ctx.strokeStyle = P.edge; ctx.lineWidth = 2.5;
          const wob = Math.sin(t * 2) * 0.06;
          if (this.variant === 0) {
            polyPath(x, y, r, 6, Math.PI / 6 + wob);
            ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
            ctx.strokeStyle = P.deco; ctx.lineWidth = 1.5;
            polyPath(x, y, r * 0.76, 6, Math.PI / 6 + wob); ctx.stroke();
            ctx.fillStyle = P.edge;
            for (let i = 0; i < 6; i++) {
              const ang = Math.PI / 6 + wob + i * Math.PI / 3;
              ctx.beginPath(); ctx.arc(x + Math.cos(ang) * r * 0.88, y + Math.sin(ang) * r * 0.88, 2.2, 0, Math.PI * 2); ctx.fill();
            }
          } else if (this.variant === 1) {
            // 甲虫：两侧翅膀 + 菱形机身
            ctx.fillStyle = P.wing;
            for (const side of [-1, 1]) {
              ctx.beginPath();
              ctx.ellipse(x + side * r * 0.62, y - r * 0.1, r * 0.48, r * 0.26, side * (0.5 + Math.sin(t * 6) * 0.15), 0, Math.PI * 2);
              ctx.fill(); ctx.stroke();
            }
            ctx.fillStyle = P.fill;
            polyPath(x, y, r * 0.92, 4, Math.PI / 2 + wob);
            ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
            ctx.strokeStyle = P.deco; ctx.lineWidth = 1.5;
            polyPath(x, y, r * 0.7, 4, Math.PI / 2 + wob); ctx.stroke();
          } else {
            // 八角核心 + 准星刻度
            polyPath(x, y, r, 8, Math.PI / 8 + wob);
            ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
            ctx.strokeStyle = P.deco; ctx.lineWidth = 2;
            for (let i = 0; i < 4; i++) {
              const ang = t + i * Math.PI / 2;
              ctx.beginPath();
              ctx.moveTo(x + Math.cos(ang) * r * 0.66, y + Math.sin(ang) * r * 0.66);
              ctx.lineTo(x + Math.cos(ang) * r * 0.96, y + Math.sin(ang) * r * 0.96);
              ctx.stroke();
            }
            ctx.setLineDash([3, 5]);
            ctx.beginPath(); ctx.arc(x, y, r * 0.78, 0, Math.PI * 2); ctx.stroke();
            ctx.setLineDash([]);
          }
          ctx.fillStyle = P.core;
          ctx.beginPath(); ctx.arc(x, y, r * 0.62, 0, Math.PI * 2); ctx.fill();
        }

        // 文字：按宽度自动缩小，长句型也放得下
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowBlur = 4;
        ctx.shadowColor = '#000000';
        ctx.fillStyle = '#ffffff';
        const showHint = difficulty !== 'hard' && this.hint && this.hint !== this.word;
        const wordY = y - (showHint ? r * 0.14 : 0);
        fitText(this.word, x, wordY, Math.round((this.isBoss ? 28 : 26) * UI_SCALE), r * 1.5, 'bold');
        if (showHint) {
          ctx.fillStyle = P.hint;
          fitText(this.hint, x, y + r * 0.34, Math.max(11, Math.round(18 * UI_SCALE)), r * 1.45, '');
        }

        if (this.isBoss) {
          const barW = 108;
          const barH = 10;
          const bx = this.x - barW / 2;
          const by = this.y - this.radius - 18;
          ctx.fillStyle = 'rgba(0,0,0,0.7)';
          ctx.fillRect(bx, by, barW, barH);
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(bx, by, barW * (this.hp / this.maxHp), barH);
          ctx.strokeStyle = '#fca5a5';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(bx, by, barW, barH);
        }

        ctx.restore();
      }
    }

    // ===== 句子组合怪：上方光球（看整句）＋ 4 个晶舱（按顺序输入）=====
    const COMBO_COLORS = { body: 'rgba(46, 16, 101, 0.92)', edge: '#a78bfa', glow: '#8b5cf6', active: '#fbbf24', activeFill: 'rgba(120, 72, 6, 0.95)', done: 'rgba(167, 139, 250, 0.35)', text: '#ffffff', hint: '#ddd6fe' };
    class ComboBoss {
      constructor(data) {
        this.isBoss = true;
        this.isCombo = true;
        this.kind = 'combo';
        this.data = data;
        this.segs = data.segs;
        this.idx = 0;
        this.maxHp = this.segs.length;
        this.hp = this.segs.length;
        this.x = canvas.width / 2;
        this.y = -110;
        this.radius = 26 * UI_SCALE;
        this.podGap = 58 * UI_SCALE;
        this.podH = Math.round(56 * Math.max(0.82, UI_SCALE));
        this.age = 0;
        this.flash = new Array(this.segs.length).fill(0);   // 光罩弹开时闪一下
        this.pop = new Array(this.segs.length).fill(0);     // 晶舱被击破时的动画
        const baseSpeed = ((0.5 + wave * 0.08) * difficultySettings[difficulty].speedMult) * 0.5 * stageSpeedMult();
        this.speed = baseSpeed * 0.42;
        this.defeated = false;
      }
      get word() { return this.idx < this.segs.length ? this.segs[this.idx].t : ''; }
      get readings() { return this.idx < this.segs.length ? this.segs[this.idx].a : []; }
      layout() {
        const n = this.segs.length;
        const gap = 8;
        const podW = Math.min(118, (canvas.width - 20 - gap * (n - 1)) / n);
        const podH = this.podH;
        const total = podW * n + gap * (n - 1);
        const left = Math.max(10, this.x - total / 2);
        const pods = [];
        for (let i = 0; i < n; i++) {
          const bob = Math.sin(this.age / 30 + i * 1.3) * 3;
          pods.push({ x: left + i * (podW + gap), y: this.y + this.podGap + bob, w: podW, h: podH });
        }
        return pods;
      }
      bottomY() { return this.y + this.podGap + this.podH; }
      hitTest(px, py) {
        if (Math.hypot(px - this.x, py - this.y) <= this.radius + 10) return { part: 'head' };
        const pods = this.layout();
        for (let i = 0; i < pods.length; i++) {
          const p = pods[i];
          if (px >= p.x - 3 && px <= p.x + p.w + 3 && py >= p.y - 3 && py <= p.y + p.h + 3) return { part: 'seg', i };
        }
        return null;
      }
      advance() {
        this.pop[this.idx] = 1;
        this.idx++;
        this.hp = this.segs.length - this.idx;
      }
      bounce(j) {
        this.flash[j] = 1;
      }
      update() {
        this.age++;
        const slowFactor = slowTimer > 0 ? 0.4 : 1.0;
        this.y += this.speed * slowFactor;
        for (let i = 0; i < this.flash.length; i++) {
          this.flash[i] = Math.max(0, this.flash[i] - 0.04);
          this.pop[i] = Math.max(0, this.pop[i] - 0.05);
        }
      }
      draw() {
        const C = COMBO_COLORS;
        const pods = this.layout();
        const t = this.age / 60;
        ctx.save();
        // 光丝：光球连到每个晶舱
        pods.forEach((p, i) => {
          if (i < this.idx) return;
          const cxp = p.x + p.w / 2;
          ctx.strokeStyle = i === this.idx ? 'rgba(251, 191, 36, 0.75)' : 'rgba(167, 139, 250, 0.35)';
          ctx.lineWidth = i === this.idx ? 2 : 1.2;
          ctx.beginPath();
          ctx.moveTo(this.x, this.y + this.radius * 0.6);
          ctx.quadraticCurveTo((this.x + cxp) / 2, this.y + this.podGap * 0.86, cxp, p.y);
          ctx.stroke();
        });
        // 光球（点击看整句）
        const pulse = 0.5 + 0.5 * Math.sin(t * 3);
        ctx.shadowColor = C.glow; ctx.shadowBlur = 16 + pulse * 10;
        const grd = ctx.createRadialGradient(this.x - 6, this.y - 8, 2, this.x, this.y, this.radius);
        grd.addColorStop(0, '#f5f3ff'); grd.addColorStop(0.35, '#c4b5fd'); grd.addColorStop(1, '#5b21b6');
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(221, 214, 254, 0.7)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.ellipse(this.x, this.y, this.radius + 9, (this.radius + 9) * 0.38, t * 0.6, 0, Math.PI * 2); ctx.stroke();
        for (let k = 0; k < 3; k++) {
          const a = t * 1.6 + k * Math.PI * 2 / 3;
          ctx.fillStyle = '#fde68a';
          ctx.beginPath(); ctx.arc(this.x + Math.cos(a) * (this.radius + 9), this.y + Math.sin(a) * (this.radius + 9) * 0.38, 2.4, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = '#2e1065';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = "bold 18px 'Noto Sans JP', sans-serif";
        ctx.fillText('文', this.x, this.y + 1);
        // 晶舱
        const showHint = difficulty !== 'hard';
        pods.forEach((p, i) => {
          const done = i < this.idx, active = i === this.idx;
          const sc = 1 + this.pop[i] * 0.15;
          ctx.save();
          ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
          ctx.scale(sc, sc);
          const x0 = -p.w / 2, y0 = -p.h / 2;
          roundRectPath(x0, y0, p.w, p.h, 12);
          if (done) {
            ctx.setLineDash([4, 4]);
            ctx.strokeStyle = C.done; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.setLineDash([]);
          } else {
            ctx.shadowColor = active ? C.active : C.glow;
            ctx.shadowBlur = active ? 14 + pulse * 8 : 6;
            ctx.fillStyle = active ? C.activeFill : C.body;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = active ? C.active : C.edge; ctx.lineWidth = active ? 2.5 : 1.5; ctx.stroke();
            if (!active) {
              // 光罩：半透明的护盾泡和高光
              const f = this.flash[i];
              ctx.fillStyle = `rgba(196, 181, 253, ${0.12 + f * 0.5})`;
              roundRectPath(x0 - 3, y0 - 3, p.w + 6, p.h + 6, 15); ctx.fill();
              ctx.strokeStyle = `rgba(221, 214, 254, ${0.35 + f * 0.6})`; ctx.lineWidth = 1 + f * 2; ctx.stroke();
              ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)'; ctx.lineWidth = 1.5;
              ctx.beginPath(); ctx.arc(x0 + 14, y0 + 12, 7, Math.PI * 1.05, Math.PI * 1.6); ctx.stroke();
            }
          }
          // 顺序编号：晶舱左上角外侧的小圆章
          ctx.fillStyle = done ? '#3b2a63' : (active ? C.active : '#4c1d95');
          ctx.beginPath(); ctx.arc(x0 + 4, y0 + 2, 8, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = active ? '#1c1917' : '#ede9fe';
          ctx.font = "bold 10px 'Noto Sans JP', sans-serif";
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(String(i + 1), x0 + 4, y0 + 2.5);
          // 文字：放不下就自动换成两行；提示只在放得下时显示
          ctx.save();
          roundRectPath(x0, y0, p.w, p.h, 12); ctx.clip();
          ctx.globalAlpha = done ? 0.45 : 1;
          ctx.fillStyle = C.text;
          ctx.shadowColor = '#000'; ctx.shadowBlur = 3;
          const lines = podTextLayout(this.segs[i].t, p.w - 10);
          const hintOn = showHint && !done && lines.lines.length === 1;
          ctx.font = `bold ${lines.size}px 'Noto Sans JP', sans-serif`;
          lines.lines.forEach((ln, k) => {
            const yy = hintOn ? -7 : (lines.lines.length === 1 ? 1 : (k === 0 ? -8 : 9));
            ctx.fillText(ln, 0, yy);
          });
          if (hintOn) {
            ctx.fillStyle = C.hint;
            fitText(this.segs[i].a[0], 0, 15, 11, p.w - 8, '');
          }
          ctx.restore();
          ctx.restore();
        });
        // 进度条
        const barW = 110, bx = this.x - barW / 2, by = this.y - this.radius - 16;
        ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(bx, by, barW, 8);
        ctx.fillStyle = '#a78bfa'; ctx.fillRect(bx, by, barW * (this.idx / this.segs.length), 8);
        ctx.strokeStyle = '#ddd6fe'; ctx.lineWidth = 1; ctx.strokeRect(bx, by, barW, 8);
        ctx.restore();
      }
    }
    // 晶舱文字排版：先试单行 17→12px，放不下就拆成两行
    function podTextLayout(text, maxW) {
      for (let size = 17; size >= 12; size--) {
        ctx.font = `bold ${size}px 'Noto Sans JP', sans-serif`;
        if (ctx.measureText(text).width <= maxW) return { size, lines: [text] };
      }
      const mid = Math.ceil(text.length / 2);
      const a = text.slice(0, mid), b = text.slice(mid);
      for (let size = 15; size >= 9; size--) {
        ctx.font = `bold ${size}px 'Noto Sans JP', sans-serif`;
        if (Math.max(ctx.measureText(a).width, ctx.measureText(b).width) <= maxW) return { size, lines: [a, b] };
      }
      return { size: 9, lines: [a, b] };
    }
    function roundRectPath(x, y, w, h, r) {
      r = Math.min(r, h / 2, w / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }
    function spawnCombo() {
      const data = nextCombo();
      if (!data) return null;
      const cb = new ComboBoss(data);
      invaders.push(cb);
      addFloatingText('①→②→③→④', canvas.width / 2 - 45, 60, '#c4b5fd');
      return cb;
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x; this.y = y;
        this.color = color || '#2dd4bf';
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1.0;
        this.decay = Math.random() * 0.03 + 0.02;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        this.alpha -= this.decay;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function addFloatingText(text, x, y, color = '#2dd4bf') {
      const div = document.createElement('div');
      div.className = 'absolute font-bold text-xs sm:text-sm pointer-events-none floating-anim pixel-font';
      div.style.left = `${x}px`;
      div.style.top = `${y}px`;
      div.style.color = color;
      div.textContent = text;
      canvas.parentElement.appendChild(div);
      setTimeout(() => div.remove(), 1500);
    }

    function showItemNotification(name, iconClass = 'fa-wand-magic-sparkles') {
      const notif = document.getElementById('itemNotification');
      const textEl = document.getElementById('itemNotifyText');
      textEl.innerHTML = `<i class="fa-solid ${iconClass} text-yellow-400 text-base mr-1"></i> ${name}`;
      notif.classList.remove('opacity-0', '-translate-y-4');
      notif.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        notif.classList.remove('opacity-100', 'translate-y-0');
        notif.classList.add('opacity-0', '-translate-y-4');
      }, 1500);
    }

    function startGame(keepSelection) {
      initAudio();
      if (!keepSelection) {
        level = menuLevel;
        applyMenuSelection();
      }
      if (gameMode === 'campaign') enterStage(campaignDay);
      endlessStartAt = performance.now();
      runRecorded = false;
      hideNameForm();
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      document.getElementById('stageScreen').classList.add('hidden');
      gameState = 'PLAYING';
      score = 0;
      combo = 1;
      wave = 1;
      lives = 3;
      bonusLives = 0;
      defeatedCount = 0;
      bossesDefeatedCount = 0;
      oneKillCharges = 0;
      bossEncounters = 0;
      bossCooldownUntil = 0;
      killsAtBossClear = 0;
      bossWasAlive = false;
      killsAtLastWave = 0;
      invaders = [];
      particles = [];
      slowTimer = 0;
      if (gameMode === 'campaign') wave = campaignDay;
      resetWordBags();
      spawnInterval = difficultySettings[difficulty].interval;
      
      lastSpawnTime = performance.now();
      spawnInvader();
      
      updateHUD();
      document.getElementById('kanjiInput').focus();
      currentBgmMode = 'normal';
      bgm.setMode('normal');
      startBGM();
      requestAnimationFrame(gameLoop);
    }

    function restartGame() {
      startGame(true);
    }

    function returnToMenu() {
      if ((gameState === 'PLAYING' || gameState === 'PAUSED' || gameState === 'INFO' || gameState === 'STAGECLEAR') && score > 0) recordRun(false);
      gameState = 'START';
      stopBGM();
      fillStageSelect();
      updateBestLine();
      document.getElementById('startScreen').classList.remove('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      document.getElementById('stageScreen').classList.add('hidden');
    }

    // ===== 通关：过关 / 全部通关 =====
    // ===== 本机分数记录 & 排行榜（localStorage，只保存在这台设备上）=====
    const REC_KEY = 'kanjiInvadersRecords', BOARD_KEY = 'kanjiInvadersBoard', NAME_KEY = 'kanjiInvadersName';
    function readJSON(key, fallback) {
      try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; } catch (e) { return fallback; }
    }
    function writeJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
    const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
    // 每局结束（游戏结束 / 通关）自动保存一条记录
    let runRecorded = false;
    function recordRun(cleared) {
      if (runRecorded) return;
      runRecorded = true;
      const rec = readJSON(REC_KEY, { best: {}, recent: [] });
      rec.best = rec.best || {}; rec.recent = rec.recent || [];
      rec.best[level] = Math.max(rec.best[level] || 0, score);
      rec.recent.unshift({ score, level, mode: gameMode, stage: gameMode === 'campaign' ? campaignDay : wave, cleared: !!cleared, date: today() });
      rec.recent = rec.recent.slice(0, 20);
      writeJSON(REC_KEY, rec);
      updateBestLine();
    }
    function updateBestLine() {
      const rec = readJSON(REC_KEY, { best: {} });
      const b = rec.best || {};
      document.getElementById('bestLine').textContent = (b.N2 || b.N1) ? t('bestLine', { n2: b.N2 || 0, n1: b.N1 || 0 }) : '';
    }
    function addToBoard(name, cleared) {
      const board = readJSON(BOARD_KEY, []);
      const entry = { name: name || t('anon'), score, level, cleared: !!cleared, mode: gameMode, stage: gameMode === 'campaign' ? campaignDay : wave, date: today(), id: Date.now() };
      board.push(entry);
      board.sort((a, b) => b.score - a.score);
      const kept = board.slice(0, 20);
      writeJSON(BOARD_KEY, kept);
      return { board: kept, id: entry.id, rank: board.findIndex(e => e.id === entry.id) + 1 };
    }
    function esc(str) { return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function boardTableHTML(board, meId, limit) {
      if (!board.length) return `<p class="board-empty">${t('boardEmpty')}</p>`;
      const rows = board.slice(0, limit || 10).map((e, i) => `<tr class="${e.id === meId ? 'me' : ''}"><td class="rank">${i + 1}</td><td class="name">${esc(e.name)}</td><td>${e.level}${e.cleared === false ? '' : ' ✓'}</td><td class="num">${e.score}</td><td>${e.date.slice(5)}</td></tr>`).join('');
      return `<div style="overflow-x:auto"><table class="board-table"><thead><tr><th>${t('colRank')}</th><th>${t('colName')}</th><th>${t('colLevel')}</th><th style="text-align:right">${t('colScore')}</th><th>${t('colDate')}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }
    function recentTableHTML() {
      const rec = readJSON(REC_KEY, { recent: [] });
      const list = (rec.recent || []).slice(0, 8);
      if (!list.length) return '';
      const rows = list.map(r => `<tr><td>${r.date.slice(5)}</td><td>${r.level}</td><td>${r.mode === 'campaign' ? t('modeC') + ' ' + r.stage : t('modeE') + ' W' + r.stage}${r.cleared ? ' ✓' : ''}</td><td class="num">${r.score}</td></tr>`).join('');
      return `<div class="board-sub">${t('recentTitle')}</div><div style="overflow-x:auto"><table class="board-table"><thead><tr><th>${t('colDate')}</th><th>${t('colLevel')}</th><th>${t('colMode')}</th><th style="text-align:right">${t('colScore')}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }
    let boardPaused = false;
    function openBoard() {
      if (gameState === 'PLAYING') { gameState = 'INFO'; boardPaused = true; }
      document.getElementById('boardList').innerHTML = `<div class="board-sub">${t('clearsTitle')}</div>` + boardTableHTML(readJSON(BOARD_KEY, []), null, 10);
      document.getElementById('recentList').innerHTML = recentTableHTML();
      document.getElementById('boardCard').classList.add('open');
    }
    function closeBoard() {
      document.getElementById('boardCard').classList.remove('open');
      if (boardPaused && gameState === 'INFO') { gameState = 'PLAYING'; lastSpawnTime = performance.now(); requestAnimationFrame(gameLoop); }
      boardPaused = false;
    }
    document.getElementById('boardBackdrop').addEventListener('click', closeBoard);
    document.addEventListener('keydown', (e) => { if (document.getElementById('boardCard').classList.contains('open') && e.key === 'Escape') closeBoard(); });
    // 通关时：输入名字 → 登上排行榜
    const NAME_FORMS = {
      clear: { form: 'nameForm', input: 'playerName', view: 'boardView' },
      over:  { form: 'goNameForm', input: 'goPlayerName', view: 'goBoardView' }
    };
    function showNameForm(which, cleared) {
      const ids = NAME_FORMS[which || 'clear'];
      const form = document.getElementById(ids.form);
      const input = document.getElementById(ids.input);
      const view = document.getElementById(ids.view);
      view.hidden = true;
      if (score <= 0) { form.hidden = true; return; }
      input.placeholder = t('namePh');
      input.value = readJSON(NAME_KEY, '') || '';
      form.hidden = false;
      form.onsubmit = (e) => {
        e.preventDefault();
        const name = input.value.trim().slice(0, 12);
        writeJSON(NAME_KEY, name);
        const r = addToBoard(name, cleared);
        form.hidden = true;
        view.innerHTML = `<p class="text-yellow-300 font-bold text-sm mb-2">${t('saved', { r: r.rank })}</p>` + boardTableHTML(r.board, r.id, 10);
        view.hidden = false;
        input.blur();
      };
    }
    function hideNameForm() {
      Object.values(NAME_FORMS).forEach(ids => {
        document.getElementById(ids.form).hidden = true;
        document.getElementById(ids.view).hidden = true;
      });
    }

    function showStageScreen(title, sub, stats, primary, primaryFn, secondary, secondaryFn) {
      const $ = id => document.getElementById(id);
      $('stageTitle').textContent = title;
      $('stageSub').textContent = sub;
      $('stageStats').innerHTML = stats;
      $('stagePrimary').textContent = primary;
      $('stagePrimary').onclick = primaryFn;
      $('stageSecondary').textContent = secondary;
      $('stageSecondary').onclick = secondaryFn;
      hideNameForm();
      $('stageScreen').classList.remove('hidden');
    }
    function stageStatsHTML() {
      return `<div class="flex justify-between"><span>${t('stScore')}</span><b class="text-teal-300">${score}</b></div>
              <div class="flex justify-between"><span>${t('stKills')}</span><b class="text-teal-300">${stageKills}</b></div>
              <div class="flex justify-between"><span>${t('stShield')}</span><b class="text-teal-300">${lives}${bonusLives ? ' + ' + bonusLives : ''}</b></div>`;
    }
    function nextStage() {
      document.getElementById('stageScreen').classList.add('hidden');
      enterStage(campaignDay + 1);
      wave = campaignDay;
      invaders = [];
      bossEncounters = 0; bossCooldownUntil = 0; killsAtBossClear = defeatedCount; bossWasAlive = false; killsAtLastWave = defeatedCount;
      spawnInterval = difficultySettings[difficulty].interval;
      lastSpawnTime = performance.now();
      gameState = 'PLAYING';
      currentBgmMode = 'normal';
      bgm.setMode('normal');
      startBGM();
      updateHUD();
      addFloatingText(t('stageStart', { n: campaignDay }), canvas.width / 2 - 60, 40, '#2dd4bf');
      requestAnimationFrame(gameLoop);
    }
    function stageClear() {
      stageCleared = true;
      gameState = 'STAGECLEAR';
      stopBGM();
      sound.playItem();
      const stages = JLPT_DATA[level].stages;
      saveProgress(level, Math.min(stages.length, campaignDay + 1));
      if (campaignDay < stages.length) {
        const nextSt = stages.find(x => x.n === campaignDay + 1);
        showStageScreen(t('stageClear', { n: campaignDay }), t('nextLabel') + t('stageN', { n: nextSt.n }) + ' ' + stageTitle(nextSt), stageStatsHTML(),
          t('goNext', { n: campaignDay + 1 }), nextStage, t('backMenu'), returnToMenu);
      } else if (level === 'N2') {
        saveProgress('N2', stages.length);
        recordRun(true);
        showStageScreen('Congratulations!', t('congratsN2'), stageStatsHTML(),
          t('continueN1'), () => { menuLevel = 'N1'; level = 'N1'; campaignDay = 1; document.getElementById('stageScreen').classList.add('hidden'); startGame(true); },
          t('declineN1'), () => { selectLevel('N2'); returnToMenu(); });
        showNameForm('clear', true);
      } else {
        recordRun(true);
        showStageScreen('Congratulations!', t('congratsN1'), stageStatsHTML(),
          t('backMenu'), returnToMenu, t('reviewEndless'), () => { selectMode('endless'); returnToMenu(); });
        showNameForm('clear', true);
      }
    }

    function togglePause() {
      if (gameState === 'PLAYING') {
        gameState = 'PAUSED';
        stopBGM();
        document.getElementById('pauseBtn').innerHTML = '<i class="fa-solid fa-play"></i>';
      } else if (gameState === 'PAUSED') {
        gameState = 'PLAYING';
        startBGM();
        document.getElementById('pauseBtn').innerHTML = '<i class="fa-solid fa-pause"></i>';
        requestAnimationFrame(gameLoop);
      }
    }

    function toggleAudio() {
      soundEnabled = !soundEnabled;
      document.getElementById('audioBtn').innerHTML = soundEnabled ? '<i class="fa-solid fa-volume-high"></i>' : '<i class="fa-solid fa-volume-xmark text-stone-500"></i>';
      if (!soundEnabled) {
        stopBGM();
      } else if (gameState === 'PLAYING') {
        startBGM();
      }
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      recordRun(false);
      showNameForm('over', false);
      stopBGM();
      sound.playDamage();
      document.getElementById('finalScore').textContent = score;
      document.getElementById('finalWave').textContent = wave;
      document.getElementById('finalDefeated').textContent = defeatedCount;
      document.getElementById('retryBtn').innerHTML = gameMode === 'campaign'
        ? `<i class="fa-solid fa-rotate-right mr-2"></i> ${t('retryStage', { n: campaignDay })}`
        : `<i class="fa-solid fa-rotate-right mr-2"></i> ${t('retry')}`;
      document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    function spawnInvader() {
      if (gameState !== 'PLAYING') return;

      const bossAlive = invaders.some(i => i.isBoss && !i.defeated);
      const rested = !bossAlive && performance.now() >= bossCooldownUntil && defeatedCount - killsAtBossClear >= BOSS_REST_KILLS;

      if (gameMode === 'campaign') {
        // 打够数量 → 当天的句子组合怪；之前会出现 1 个、2 个语法 BOSS
        if (!stageFinalSpawned && stageKills >= stageTarget && !bossAlive) {
          stageFinalSpawned = true;
          bossWasAlive = true;
          spawnCombo();
          return;
        }
        if (!stageFinalSpawned && rested && stageBossBatches < 3 && stageKills >= 6 + stageBossBatches * 8) {
          spawnGrammarBosses(stageBossBatches + 1);
          stageBossBatches++;
          return;
        }
      } else if (wave >= 2 && rested) {
        const comboOnly = bossEncounters >= BOSS_MAX_COUNT || performance.now() - endlessStartAt > ENDLESS_COMBO_AFTER_MS;
        bossEncounters++;
        bossWasAlive = true;
        if (comboOnly) spawnCombo();
        else spawnGrammarBosses(Math.min(BOSS_MAX_COUNT, bossEncounters));
        return;
      }

      if (bossAlive && Math.random() < 0.5) return;   // Boss 战期间普通敌人减半
      const isSpecial = Math.random() < 0.30;
      invaders.push(new Invader(false, null, isSpecial));
    }

    // 「一击」自动发动：BOSS 完全进入画面后，直接消灭（不包括句子组合怪）
    function tryAutoOneKill() {
      if (oneKillCharges <= 0) return;
      const target = invaders.find(i => i.isBoss && !i.isCombo && !i.defeated && i.y > i.radius * 0.6);
      if (!target) return;
      oneKillCharges--;
      target.hp = 0;
      target.defeated = true;
      defeatedCount++;
      if (gameMode === 'campaign') stageKills++;
      bossesDefeatedCount++;
      score += 500 * combo;
      for (let p = 0; p < 26; p++) particles.push(new Particle(target.x, target.y, p % 2 ? '#fde047' : '#ef4444'));
      addFloatingText(`⚡ ${t('oneKillFired')} +${500 * combo}`, Math.max(8, target.x - 50), target.y, '#fde047');
      sound.playItem();
      triggerScreenShake();
      triggerVibrate([60, 40, 60]);
      if (bossesDefeatedCount % 2 === 0) {
        bonusLives++;
        showItemNotification(t('shieldBonus'), "fa-shield-heart");
        triggerLifePulse();
      }
      updateHUD();
    }

    function spawnGrammarBosses(count) {
      bossWasAlive = true;
      for (let i = 0; i < count; i++) {
        const bossTemplate = nextGrammar(wordsOnScreen());
        const boss = new Invader(true, bossTemplate, false);
        boss.x = (canvas.width / (count + 1)) * (i + 1) + (Math.random() - 0.5) * 20;
        invaders.push(boss);
      }
    }

    function submitInput() {
      if (gameState !== 'PLAYING') return;
      const inputEl = document.getElementById('kanjiInput');
      const val = inputEl.value.trim().toLowerCase();
      if (!val) return;

      let matched = false;
      for (let i = 0; i < invaders.length; i++) {
        const inv = invaders[i];
        if (inv.defeated) continue;
        const hitMatch = inv.word === val || inv.readings.some(r => r === val);

        if (hitMatch) {
          matched = true;
          if (inv.isCombo) {
            inv.advance();
          } else {
            inv.hp--;
          }
          sound.playHit();
          triggerVibrate(40);
          triggerScreenShake();

          if (inv.hp <= 0) {
            inv.defeated = true;
            defeatedCount++;

            for (let p = 0; p < 18; p++) {
              particles.push(new Particle(inv.x, inv.y, inv.isCombo ? '#c4b5fd' : (inv.isBoss ? '#ef4444' : '#2dd4bf')));
            }
            if (gameMode === 'campaign') stageKills++;

            if (inv.isCombo) {
              bossesDefeatedCount++;
              score += 800 * combo;
              triggerScreenShake();
              triggerVibrate([80, 50, 80, 50, 120]);
              addFloatingText(`+${800 * combo} ${t('sentenceDone')}`, Math.max(8, inv.x - 50), inv.y, '#c4b5fd');
              addFloatingText(inv.data.full, 10, inv.y + 30, '#fde68a');
              if (bossesDefeatedCount % 2 === 0) {
                bonusLives++;
                showItemNotification(t('shieldBonus'), "fa-shield-heart");
                triggerLifePulse();
              }
              if (gameMode === 'campaign' && stageFinalSpawned) {
                stageCombosLeft--;
                if (stageCombosLeft <= 0) {
                  stageClearAt = performance.now() + 900;   // 稍等一下再显示过关画面
                } else {
                  stageFinalSpawned = false;                // 马上出下一只组合怪
                }
              }
            } else if (inv.isBoss) {
              bossesDefeatedCount++;
              score += 500 * combo;
              triggerScreenShake();
              triggerVibrate([80, 50, 80]);
              addFloatingText(`+${500 * combo}`, inv.x - 30, inv.y, '#f87171');

              if (bossesDefeatedCount % 2 === 0) {
                bonusLives++;
                showItemNotification(t('shieldBonus'), "fa-shield-heart");
                sound.playItem();
                triggerLifePulse();
              }
            } else if (inv.isSpecialKun) {
              score += 250 * combo;
              combo++;
              triggerVibrate(60);
              addFloatingText(`+${250 * (combo - 1)}`, inv.x - 25, inv.y, '#fbbf24');

              const itemType = Math.floor(Math.random() * 4);
              if (itemType === 0) {
                bonusLives++;
                showItemNotification(t('itemShield'), "fa-shield-heart");
                sound.playItem();
                triggerLifePulse();
              } else if (itemType === 1) {
                slowTimer = 350;
                showItemNotification(t('itemSlow'), "fa-hourglass-half");
                sound.playItem();
              } else if (itemType === 2) {
                const others = invaders.filter(other => !other.defeated && other !== inv && !other.isCombo);
                others.sort((a, b) => Math.hypot(a.x - inv.x, a.y - inv.y) - Math.hypot(b.x - inv.x, b.y - inv.y));
                const targetsToHit = others.slice(0, 3);
                targetsToHit.forEach(t => {
                  t.hp--;
                  if (t.hp <= 0) t.defeated = true;
                  for (let p = 0; p < 8; p++) particles.push(new Particle(t.x, t.y, '#f59e0b'));
                });
                showItemNotification(t('itemSpread'), "fa-burst");
                sound.playItem();
              } else {
                oneKillCharges++;
                showItemNotification(t('itemOneKill'), "fa-bolt");
                sound.playItem();
              }
            } else {
              score += 100 * combo;
              combo++;
              addFloatingText(`+${100 * (combo - 1)}`, inv.x - 20, inv.y, '#2dd4bf');
            }
          } else if (inv.isCombo) {
            const pod = inv.layout()[inv.idx - 1];
            for (let p = 0; p < 10; p++) particles.push(new Particle(pod.x + pod.w / 2, pod.y + pod.h / 2, '#fbbf24'));
            addFloatingText(`${inv.idx}/${inv.segs.length} OK!`, pod.x, pod.y, '#fde68a');
            score += 100 * combo;
            combo++;
          } else {
            for (let p = 0; p < 6; p++) particles.push(new Particle(inv.x, inv.y, '#fca5a5'));
            addFloatingText("HIT!", inv.x - 15, inv.y, '#fca5a5');
          }
          break;
        }
      }

      // 组合怪：输入了后面某段的读音 → 被光罩弹开
      if (!matched) {
        for (const inv of invaders) {
          if (!inv.isCombo || inv.defeated) continue;
          const j = inv.segs.findIndex((sg, k) => k > inv.idx && sg.a.includes(val));
          if (j !== -1) {
            matched = true;
            inv.bounce(j);
            const pod = inv.layout()[j];
            for (let p = 0; p < 8; p++) particles.push(new Particle(pod.x + pod.w / 2, pod.y, '#ddd6fe'));
            addFloatingText(t('bounce', { c: '①②③④⑤⑥'[inv.idx] }), Math.max(8, pod.x - 20), pod.y - 10, '#ddd6fe');
            sound.playShoot();
            triggerVibrate([30, 30, 30]);
            combo = 1;
            break;
          }
        }
      }

      if (!matched) {
        combo = 1;
        sound.playShoot();
        triggerVibrate([40, 40]);
        triggerScreenShake();
        addFloatingText("MISS", canvas.width / 2 - 15, canvas.height - 70, '#f43f5e');
      }

      inputEl.value = '';
      updateHUD();
    }

    function triggerLifePulse() {
      const container = document.getElementById('livesContainer');
      container.classList.add('pulse-anim');
      setTimeout(() => container.classList.remove('pulse-anim'), 500);
    }

    document.getElementById('kanjiInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        submitInput();
      }
    });

    function updateHUD() {
      document.getElementById('scoreText').textContent = String(score).padStart(5, '0');
      document.getElementById('comboText').textContent = `x${Math.max(1, combo)}`;
      document.getElementById('waveLabel').textContent = gameMode === 'campaign' ? (level + ' STAGE') : (level + ' WAVE');
      document.getElementById('waveText').textContent = String(gameMode === 'campaign' ? campaignDay : wave).padStart(2, '0');

      let hearts = '';
      for (let i = 0; i < 3; i++) {
        hearts += (i < lives) ? '<i class="fa-solid fa-shield-heart"></i> ' : '<i class="fa-regular fa-shield text-stone-600"></i> ';
      }
      
      if (bonusLives > 0) {
        hearts += `<span class="inline-flex items-center gap-0.5 ml-1 pl-1.5 border-l border-stone-700 text-rose-400 text-xs font-bold"><span class="w-2.5 h-2.5 rounded-full bg-rose-500 inline-block shadow-[0_0_6px_#f43f5e]"></span>+${bonusLives}</span>`;
      }
      if (oneKillCharges > 0) {
        hearts += `<span class="inline-flex items-center gap-0.5 ml-1.5 pl-1.5 border-l border-stone-700 text-yellow-300 text-xs font-bold"><i class="fa-solid fa-bolt"></i>${oneKillCharges}</span>`;
      }
      document.getElementById('livesContainer').innerHTML = hearts;

      const listEl = document.getElementById('lockOnList');
      if (invaders.length > 0) {
        const names = invaders.slice(0, 4).map(i => i.word).filter(Boolean).join(' ');
        listEl.textContent = names + (invaders.length > 4 ? ' ...' : '');
      } else {
        listEl.textContent = t('none');
      }
    }

    let lastTime = 0;
    function gameLoop(timestamp) {
      if (gameState !== 'PLAYING') return;
      if (stageClearAt && performance.now() >= stageClearAt && !stageCleared) {
        stageClearAt = 0;
        stageClear();
        return;
      }

      const hasBoss = invaders.some(inv => inv.isBoss && !inv.defeated);
      const targetMode = hasBoss ? 'boss' : 'normal';
      if (currentBgmMode !== targetMode) {
        currentBgmMode = targetMode;
        bgm.setMode(targetMode);
      }

      // 一批 Boss 全部被打倒：开始休息时间
      if (bossWasAlive && !hasBoss) {
        bossCooldownUntil = performance.now() + BOSS_REST_MS;
        killsAtBossClear = defeatedCount;
      }
      bossWasAlive = hasBoss;

      if (!lastTime) lastTime = timestamp;
      const delta = timestamp - lastTime;
      lastTime = timestamp;

      ctx.fillStyle = '#09090b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(20, 184, 166, 0.08)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
      }
      for (let y = 0; y < canvas.height; y += 40) {
        ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
      }
      ctx.stroke();

      ctx.strokeStyle = '#f43f5e';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(0, defenseY);
      ctx.lineTo(canvas.width, defenseY);
      ctx.stroke();
      ctx.setLineDash([]);

      if (!lastSpawnTime || timestamp - lastSpawnTime > spawnInterval) {
        spawnInvader();
        lastSpawnTime = timestamp;
        if (gameMode !== 'campaign' && defeatedCount - killsAtLastWave >= 8) {   // 每打倒 8 个敌人升一波（原来会在同一个击杀数上重复升波）
          killsAtLastWave = defeatedCount;
          wave++;
          spawnInterval = Math.max(1800, spawnInterval - 200);
          addFloatingText(t('waveUp', { n: wave }), canvas.width / 2 - 30, 40, '#2dd4bf');
        }
      }

      if (slowTimer > 0) slowTimer--;
      tryAutoOneKill();

      for (let i = invaders.length - 1; i >= 0; i--) {
        const inv = invaders[i];
        inv.update();
        inv.draw();

        const reachY = inv.isCombo ? inv.bottomY() : inv.y;
        if (reachY >= defenseY && !inv.defeated) {
          if (inv.isCombo && gameMode === 'campaign') stageFinalSpawned = false;   // 让组合怪重新出现
          inv.defeated = true;
          sound.playDamage();
          combo = 1;
          triggerVibrate([100, 50, 100]);
          triggerScreenShake();

          if (bonusLives > 0) {
            bonusLives--;
          } else {
            lives--;
          }

          updateHUD();
          triggerLifePulse();
          if (lives <= 0 && bonusLives <= 0) {
            gameOver();
            return;
          }
        }

        if (inv.defeated || inv.y > canvas.height + 40) {
          invaders.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();
        if (p.alpha <= 0) particles.splice(i, 1);
      }

      requestAnimationFrame(gameLoop);
    }

    window.onload = function() {
      resizeCanvas();
      selectLevel('N2');
      selectMode('campaign');
      applyLang();
      updateHUD();
    };
  </script>
</body>
</html>
